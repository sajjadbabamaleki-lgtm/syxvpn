server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The public page is the root, in English, with Persian at /fa. These are
    # static files: no JavaScript stands between a crawler and the text.
    location = / {
        try_files /landing-en.html =404;
        add_header Cache-Control "public, max-age=300";
    }
    location = /fa {
        try_files /landing.html =404;
        add_header Cache-Control "public, max-age=300";
    }
    location = /fa/ {
        try_files /landing.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    # /en was the English page before English became the root. It is in links
    # people already have, so it is a permanent redirect rather than a 404 —
    # and permanent, so search engines move the ranking to the root instead of
    # holding two URLs for one page.
    location = /en { return 301 /; }
    location = /en/ { return 301 /; }

    # The console and storefront: one page, hash-routed, under its own prefix so
    # the marketing page can own the root.
    location /app {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # $uri/index.html so the generated article directories resolve; without
    # it /articles is not a file and falls through to the single-page app.
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 512;
}
