server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The public page is the root, in Persian, with English at /en. These are
    # static files: no JavaScript stands between a crawler and the text.
    location = / {
        try_files /landing.html =404;
        add_header Cache-Control "public, max-age=300";
    }
    location = /en {
        try_files /landing-en.html =404;
        add_header Cache-Control "public, max-age=300";
    }
    location = /en/ {
        try_files /landing-en.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    # The console and storefront: one page, hash-routed, under its own prefix so
    # the marketing page can own the root.
    location /app {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
    gzip_min_length 512;
}
