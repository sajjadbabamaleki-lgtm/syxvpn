name: cvpn

# Control plane and web app. Put a TLS reverse proxy in front of both; see
# deploy/Caddyfile.example.
#
# The gateway agent does NOT run here — it runs on each gateway host, next to
# the Xray process it manages. See docs/DEPLOYMENT.md.

services:
  api:
    build:
      context: ../server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8787
      DB_PATH: /data/cvpn.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY, e.g. openssl rand -base64 32}
      HEALTH_INTERVAL_SECONDS: ${HEALTH_INTERVAL_SECONDS:-60}
      # Snapshots of the database. The directory is a bind mount to the host
      # rather than the data volume on purpose: a snapshot that dies with the
      # volume it was protecting is not a backup.
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-6}
      BACKUP_KEEP: ${BACKUP_KEEP:-28}
      SHOP_ENABLED: ${SHOP_ENABLED:-true}
      SUPPORT_CONTACT: ${SUPPORT_CONTACT:-}
      TRON_ADDRESS: ${TRON_ADDRESS:-}
      TRON_API_KEY: ${TRON_API_KEY:-}
      PAYMENT_CONFIRMATIONS: ${PAYMENT_CONFIRMATIONS:-19}
      # Additional inbound protocols. Off unless the .env says otherwise; see
      # docs/ADAPTIVE-INBOUNDS.md.
      ADAPTIVE_INBOUNDS: ${ADAPTIVE_INBOUNDS:-false}
      ADAPTIVE_INBOUNDS_PERCENT: ${ADAPTIVE_INBOUNDS_PERCENT:-0}
      # The support bot. Off unless enabled AND given a key; see
      # docs/SUPPORT-ASSISTANT.md.
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-opus-5}
      ASSISTANT_EFFORT: ${ASSISTANT_EFFORT:-medium}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_OPERATOR_CHAT_ID: ${TELEGRAM_OPERATOR_CHAT_ID:-}
    volumes:
      - cvpn-data:/data
      # Every credential in the fleet ends up in here. Keep it 0700 and copy it
      # somewhere off this machine — see docs/DEPLOYMENT.md.
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    ports:
      - "127.0.0.1:8787:8787"

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        # Same-origin by default: the reverse proxy sends /api and /sub to the
        # API container, so the browser needs no cross-origin configuration.
        VITE_API_URL: ${VITE_API_URL:-}
        # The public address, as the landing pages advertise it to search
        # engines. Wrong here means canonical tags pointing at somewhere else.
        VITE_SITE_URL: ${SITE_URL:-https://cvpn.pro}
        # Where the Android build is published.
        VITE_APK_URL: ${APK_URL:-/download/cvpn.apk}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api

volumes:
  cvpn-data:
