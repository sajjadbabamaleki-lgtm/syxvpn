<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="SyxVPN">
  <!-- The supplied mark: five shapes, 42 corners, every edge straight, white
       over a lime light rather than drawn in lime. The light is a gradient and
       not a blur filter, so this file renders the same when it is inlined into
       a favicon, where filters are the first thing to go. -->
  <title>SyxVPN</title>
  <defs>
    <radialGradient id="syx-light" gradientUnits="userSpaceOnUse" cx="60" cy="53" r="18">
      <stop offset="0" stop-color="#d8f83a" stop-opacity=".95"/>
      <stop offset=".35" stop-color="#d8f83a" stop-opacity=".55"/>
      <stop offset=".7" stop-color="#d8f83a" stop-opacity=".16"/>
      <stop offset="1" stop-color="#d8f83a" stop-opacity="0"/>
    </radialGradient>
    <filter id="syx-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="5.5" flood-color="#d8f83a" flood-opacity=".55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#d8f83a" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="100" height="100" rx="27" fill="#0d0d0d" filter="url(#syx-glow)"/>
  <circle cx="60" cy="53" r="18" fill="url(#syx-light)"/>
