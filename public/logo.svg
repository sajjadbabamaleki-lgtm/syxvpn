<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="SyxVPN">
  <!-- The app-icon lockup: the mark over the name.
       Not the previous product's C, and deliberately not a variation on any
       other VPN's icon either — two arms converging into one stem, which is
       what the app does with a route, drawn as the Y the name turns on. -->
  <title>SyxVPN</title>
  <rect x="1.5" y="1.5" width="97" height="97" rx="26" fill="#101010" stroke="#d8f83a" stroke-width="3"/>
  <g fill="none" stroke="#d8f83a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 24 50 44 68 24"/>
    <path d="M50 44v18"/>
  </g>
  <text x="50" y="86" text-anchor="middle" fill="#d8f83a"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="700" letter-spacing="2.4">SYX VPN</text>
</svg>
