# Builds the Android app in the cloud, so nobody needs an Android toolchain on
# their own machine to get an APK.
#
# Run it from the repository's Actions tab: pick "Android APK", press "Run
# workflow". When it finishes, the APK is attached to that run under
# "Artifacts".
#
# The Xray runtime is built here too. libXray is a large native artifact and is
# not vendored in this repository, so the first job builds it from the pinned
# upstream tag and hands the .aar to the app build. That is what makes the APK
# able to open a tunnel at all: without it Gradle compiles the fail-loudly
# bridge instead. See android/README.md.
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

env:
  # Pinned deliberately. This is the code that will carry every customer's
  # traffic; "latest" is not a version anyone can audit, and a silent bump is
  # not something a build should be able to do on its own. libXray's CalVer tag
  # v26.9.9 pins Xray-core v26.9.9 through its own go.mod.
  LIBXRAY_REF: v26.9.9
  # The NDK libXray's own CI builds with.
  LIBXRAY_NDK: r29

# Creating the release below writes to the repository; nothing else here does.
permissions:
  contents: write

jobs:
  # The native runtime. Cached on the pinned tag, so this costs ten minutes once
  # and nothing on every build after it.
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Reuse the runtime built for this tag
        id: cached
        uses: actions/cache@v4
        with:
          path: runtime
          key: libxray-${{ env.LIBXRAY_REF }}-ndk${{ env.LIBXRAY_NDK }}

      - name: Check out libXray at the pinned tag
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: XTLS/libXray
          ref: ${{ env.LIBXRAY_REF }}
          path: libxray

      - name: Python
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Go
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Java 21
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        if: steps.cached.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3

      - name: Android NDK
        if: steps.cached.outputs.cache-hit != 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.LIBXRAY_NDK }}
          add-to-path: true

      # libXray's own build script, run the way its own CI runs it. Anything
      # else is a compilation method its maintainers will not answer for.
      - name: Build libXray.aar
        if: steps.cached.outputs.cache-hit != 'true'
        working-directory: libxray
        run: python3 build/main.py android

      - name: Keep it for the app build
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          mkdir -p runtime
          cp libxray/libXray.aar runtime/libXray.aar
          ls -l runtime/

      # No artifact for it. The .aar is already in a cache keyed on the tag it
      # was built from, and the build job restores that same key — uploading it
      # as well spent 94MB of the account's artifact storage on every run, for
      # a file both jobs can already reach.

  build:
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Take the runtime
        uses: actions/cache/restore@v4
        with:
          path: runtime
          key: libxray-${{ env.LIBXRAY_REF }}-ndk${{ env.LIBXRAY_NDK }}
          fail-on-cache-miss: true

      - name: Put it where the build looks for it
        run: |
          mkdir -p android/app/libs
          cp runtime/libXray.aar android/app/libs/libXray.aar

      # The build switches source sets on the presence of this file, and it does
      # so silently. A missing .aar would produce a perfectly green APK that
      # cannot connect to anything, so it is an error here rather than a
      # surprise on a phone.
      - name: Refuse to build an app with no runtime in it
        run: |
          test -s android/app/libs/libXray.aar || {
            echo "libXray.aar is missing — the APK would build without a tunnel" >&2
            exit 1
          }
          ls -l android/app/libs/

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the platform this app compiles against
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # A debug key is generated on the runner, and the runner is new every run.
      # A new key means a new signature, and Android refuses to install an update
      # signed by a different key: every build would demand that the previous one
      # be uninstalled first, taking its settings with it. So the key is kept in
      # a directory of this workflow's own, cached under a fixed name, and the
      # build is pointed at it through SYXVPN_DEBUG_KEYSTORE.
      #
      # The toolchain's own default location is not used, because it is not one
      # location: it moves with the platform and the SDK's preference directory,
      # and a cache of a path that turns out to be empty saves nothing at all
      # while looking like it worked.
      #
      # This is the ordinary Android debug key — the published password, never
      # used for a release. Release signing is separate and comes from
      # keystore.properties or the SYXVPN_KEYSTORE* variables, and nothing about
      # it is in this repository.
      - name: Restore the debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.syxvpn-debug-key
          key: android-debug-keystore-v2

      - name: Create the debug key if there was none to restore
        run: |
          mkdir -p ~/.syxvpn-debug-key
          store=~/.syxvpn-debug-key/debug.keystore
          if [ ! -f "$store" ]; then
            keytool -genkeypair -v -keystore "$store" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
          echo "SYXVPN_DEBUG_KEYSTORE=$store" >> "$GITHUB_ENV"

      # Unit tests first: they are the only thing in this pipeline that can fail
      # on a mistake the compiler is happy with — an icon path the renderer
      # cannot read whole, say.
      # The compiler's own words, repeated at the end.
      #
      # Gradle prints "e: file://…" lines and then, on failure, a stack trace of
      # its own internals hundreds of lines long. Reading a failed build from a
      # phone — or through an API that returns the tail — means reading that
      # trace and not the error, so the errors are echoed last, where the tail
      # is.
      - name: Run the unit tests
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee /tmp/gradle-test.log || {
            # As annotations too: an annotation is one small API call away,
            # where the log tail is the stack trace Gradle prints after them.
            grep -E '^e: ' /tmp/gradle-test.log | head -30 | while read -r line; do
              echo "::error::$line"
            done
            grep -E '^(e|w): ' /tmp/gradle-test.log | head -60
            grep -E '^(FAILED|.*Test.*FAILED)' /tmp/gradle-test.log | head -20
            exit 1
          }

      - name: Build the debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee /tmp/gradle-build.log || {
            grep -E '^e: ' /tmp/gradle-build.log | head -30 | while read -r line; do
              echo "::error::$line"
            done
            grep -E '^(e|w): ' /tmp/gradle-build.log | head -60
            exit 1
          }

      # Printed so the key can be checked rather than assumed: two builds that
      # show the same certificate digest will install over each other, and two
      # that do not will not. The size is printed beside it because this build
      # ships one APK per architecture to keep that number down, and a change
      # that quietly undoes the split should be visible in the log.
      - name: Say which key signed each APK, and how big it is
        working-directory: android
        run: |
          for apk in app/build/outputs/apk/debug/*.apk; do
            echo "== $(basename "$apk")  $(du -h "$apk" | cut -f1)"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" \
              | grep -i 'SHA-256 digest'
          done

      # One artifact per architecture, not one holding both. GitHub serves an
      # artifact as a zip of everything in it, so a single artifact would make
      # someone download the other architecture's copy of the runtime to get
      # their own — the download this split exists to avoid.
      # What each file actually declares. "It will not install" needs facts,
      # not a guess: the package and version the installer reads, the
      # architectures inside, and whether the file calls itself a split — a
      # split APK is not installable on its own, and that is the difference
      # between a file a phone takes and one it refuses without saying why.
      - name: Describe each APK
        working-directory: android
        run: |
          for apk in app/build/outputs/apk/debug/*.apk; do
            echo "== $(basename "$apk")  $(du -h "$apk" | cut -f1)"
            "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$apk" \
              | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|split)" || true
            printf '   abis:'
            unzip -l "$apk" | awk '$4 ~ /^lib\// {split($4, p, "/"); print p[2]}' | sort -u | tr '\n' ' '
            echo
          done

      # The build that actually ships, built on every push rather than for the
      # first time on release day.
      #
      # Debug builds are not minified, so everything R8 gets wrong is invisible
      # until the one build nobody can afford to have broken. The two failure
      # modes are different and both matter: R8 refusing to build at all, which
      # this catches outright, and R8 quietly removing something reached only by
      # name — a JNI callback, a reflected class — which produces an APK that
      # installs, starts, and does not work. Building it here at least makes the
      # first kind impossible to discover late, and puts the real size in the
      # log.
      #
      # It is signed with the debug key, deliberately. An unsigned APK cannot be
      # installed, so it could not be tested at all; a release key does not
      # belong in CI. Every artifact from here says so in its name: this is a
      # build to test, never one to publish.
      # The key that signs what people actually install.
      #
      # It is not in this repository and never will be: it arrives from four
      # repository secrets, written by android/tools/make-release-key.sh. When
      # they are absent — a fork, or before the key was made — the build still
      # runs and the APKs are signed with the debug key and labelled TEST-SIGNED,
      # because an unsigned APK cannot be installed and so cannot be tested.
      - name: Take the release signing key, if this repository has one
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "No release key configured — this run produces test builds only."
            echo "have_key=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Half a key is worse than none: it would fail deep inside Gradle with
          # a message about a keystore, hours of confusion away from the cause.
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            eval "value=\${$name:-}"
            [ -n "$value" ] || {
              echo "::error::ANDROID_KEYSTORE_BASE64 is set but ANDROID_$name is not." >&2
              exit 1
            }
          done

          store="$RUNNER_TEMP/syxvpn-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$store" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 — paste the whole of keystore.base64" >&2
            exit 1
          }
          # A truncated or mangled paste decodes into something, and that
          # something is not a keystore. Find out here, not at signing time.
          keytool -list -keystore "$store" -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null || {
            echo "::error::the decoded keystore could not be opened — check ANDROID_KEYSTORE_BASE64 and the passwords" >&2
            exit 1
          }
          chmod 600 "$store"

          # Gradle's release signingConfig reads these four.
          {
            echo "SYXVPN_KEYSTORE=$store"
            echo "SYXVPN_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SYXVPN_KEY_ALIAS=$KEY_ALIAS"
            echo "SYXVPN_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "have_key=true" >> "$GITHUB_OUTPUT"
          echo "Release key loaded. This run produces installable releases."

      - name: Build the release APK, minified as it will really ship
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee /tmp/gradle-release.log || {
            grep -E '^e: ' /tmp/gradle-release.log | head -30 | while read -r line; do
              echo "::error::$line"
            done
            grep -E '^(e|w): ' /tmp/gradle-release.log | head -60
            # R8 reports missing classes and broken keep rules here rather than
            # as compiler lines, and they are the whole reason this step exists.
            grep -iE 'R8|Missing class|proguard|shrink' /tmp/gradle-release.log | head -40
            exit 1
          }

      # One directory, whichever key was used, so everything after this reads
      # from one place and the file's own name says what signed it.
      - name: Package the release APKs
        working-directory: android
        env:
          HAVE_KEY: ${{ steps.signing.outputs.have_key }}
        run: |
          set -eu
          tools="$ANDROID_HOME/build-tools/35.0.0"
          rm -rf app/build/outputs/apk/dist
          mkdir -p app/build/outputs/apk/dist
          for apk in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk" .apk | sed 's/-unsigned$//; s/-release$//; s/^app-//')
            if [ "$HAVE_KEY" = true ]; then
              # Gradle signed and aligned it already, with the real key.
              cp "$apk" "app/build/outputs/apk/dist/syxvpn-$base.apk"
            else
              # Signed with the debug key so it can be installed and tested at
              # all, and named so nobody can mistake it for something to publish.
              out="app/build/outputs/apk/dist/syxvpn-$base-TEST-SIGNED.apk"
              "$tools/zipalign" -p -f 4 "$apk" "$out.tmp"
              "$tools/apksigner" sign \
                --ks "$SYXVPN_DEBUG_KEYSTORE" --ks-pass pass:android \
                --ks-key-alias androiddebugkey --key-pass pass:android \
                --out "$out" "$out.tmp"
              rm -f "$out.tmp" "$out.idsig"
            fi
          done
          ls -l app/build/outputs/apk/dist/

      # The check that protects everyone who has already installed the app.
      #
      # Android identifies an app by its signature. An APK signed with a
      # different key is not an update — the installer refuses it, and the only
      # way forward for the person holding the old version is to uninstall,
      # losing their account and their subscription. Nothing about that failure
      # is visible here: a build signed by the wrong key is green, uploads
      # cleanly, and looks exactly like a good one until it reaches a phone that
      # already has the app.
      #
      # So the fingerprint of the real certificate is written down in the
      # repository — it is not a secret, it is in every APK this key signs — and
      # a build that does not match it fails instead of shipping.
      - name: Refuse an APK signed by the wrong key
        if: steps.signing.outputs.have_key == 'true'
        working-directory: android
        run: |
          set -eu
          tools="$ANDROID_HOME/build-tools/35.0.0"
          pin_file=release-certificate.sha256
          # keytool writes AB:CD:..., apksigner writes abcd...; compare the
          # thing itself rather than the two spellings of it.
          normalise() { tr -d ' :\r\n' | tr 'A-Z' 'a-z'; }

          for apk in app/build/outputs/apk/dist/*.apk; do
            got=$("$tools/apksigner" verify --print-certs "$apk" \
              | awk -F': ' '/SHA-256 digest/ {print $2; exit}' | normalise)
            [ -n "$got" ] || { echo "::error::$(basename "$apk") is not signed at all" >&2; exit 1; }

            if [ ! -f "$pin_file" ]; then
              echo "::warning::No $pin_file yet. This build is signed by:"
              echo "::warning::  $got"
              echo "::warning::Commit that to android/$pin_file and every later build is checked against it."
              continue
            fi

            want=$(normalise < "$pin_file")
            if [ "$got" != "$want" ]; then
              echo "::error::$(basename "$apk") is signed by the wrong key." >&2
              echo "::error::  expected $want" >&2
              echo "::error::  got      $got" >&2
              echo "::error::Publishing this would strand every phone that already has the app." >&2
              exit 1
            fi
          done
          [ -f "$pin_file" ] && echo "All APKs are signed by the expected key." || true

      # The number that matters. A debug APK is not the size anyone downloads,
      # and until this was built it was the only one ever measured.
      - name: Say how much smaller the real build is
        working-directory: android
        run: |
          echo "== debug (not minified)"
          for apk in app/build/outputs/apk/debug/*.apk; do
            echo "   $(basename "$apk")  $(du -h "$apk" | cut -f1)"
          done
          echo "== release (R8, resources shrunk) — what a customer downloads"
          for apk in app/build/outputs/apk/dist/*.apk; do
            echo "   $(basename "$apk")  $(du -h "$apk" | cut -f1)"
          done

      # Where the APKs actually go. Not artifact storage: that lives inside the
      # account's quota, and a quota that fills takes every later build down
      # with it — which is what was happening. A release asset is a plain URL
      # outside that quota, which is also what the site's download button needs
      # and what a phone can follow.
      - name: Publish the release APKs where a phone can reach them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="app-latest"
          notes="Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}."
          # Moved rather than added to: one tag, always the newest build.
          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "SyxVPN — latest build" \
            --notes "$notes" \
            --prerelease \
            android/app/build/outputs/apk/dist/*.apk

      # A failed build is the useful output too: the compiler's own words,
      # kept where they can be read without opening a laptop.
      - name: Keep the build log on failure
        continue-on-error: true
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore
