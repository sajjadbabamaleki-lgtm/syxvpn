# Builds the Android app in the cloud, so nobody needs an Android toolchain on
# their own machine to get an APK.
#
# Run it from the repository's Actions tab: pick "Android APK", press "Run
# workflow". When it finishes, the APK is attached to that run under
# "Artifacts".
#
# The Xray runtime is built here too. libXray is a large native artifact and is
# not vendored in this repository, so the first job builds it from the pinned
# upstream tag and hands the .aar to the app build. That is what makes the APK
# able to open a tunnel at all: without it Gradle compiles the fail-loudly
# bridge instead. See android/README.md.
name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

env:
  # Pinned deliberately. This is the code that will carry every customer's
  # traffic; "latest" is not a version anyone can audit, and a silent bump is
  # not something a build should be able to do on its own. libXray's CalVer tag
  # v26.9.9 pins Xray-core v26.9.9 through its own go.mod.
  LIBXRAY_REF: v26.9.9
  # The NDK libXray's own CI builds with.
  LIBXRAY_NDK: r29

jobs:
  # The native runtime. Cached on the pinned tag, so this costs ten minutes once
  # and nothing on every build after it.
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Reuse the runtime built for this tag
        id: cached
        uses: actions/cache@v4
        with:
          path: runtime
          key: libxray-${{ env.LIBXRAY_REF }}-ndk${{ env.LIBXRAY_NDK }}

      - name: Check out libXray at the pinned tag
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: XTLS/libXray
          ref: ${{ env.LIBXRAY_REF }}
          path: libxray

      - name: Python
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Go
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Java 21
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        if: steps.cached.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v3

      - name: Android NDK
        if: steps.cached.outputs.cache-hit != 'true'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.LIBXRAY_NDK }}
          add-to-path: true

      # libXray's own build script, run the way its own CI runs it. Anything
      # else is a compilation method its maintainers will not answer for.
      - name: Build libXray.aar
        if: steps.cached.outputs.cache-hit != 'true'
        working-directory: libxray
        run: python3 build/main.py android

      - name: Keep it for the app build
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          mkdir -p runtime
          cp libxray/libXray.aar runtime/libXray.aar
          ls -l runtime/

      - name: Hand it to the next job
        uses: actions/upload-artifact@v4
        with:
          name: libxray-runtime
          path: runtime/libXray.aar
          if-no-files-found: error

  build:
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Take the runtime
        uses: actions/download-artifact@v4
        with:
          name: libxray-runtime
          path: android/app/libs

      # The build switches source sets on the presence of this file, and it does
      # so silently. A missing .aar would produce a perfectly green APK that
      # cannot connect to anything, so it is an error here rather than a
      # surprise on a phone.
      - name: Refuse to build an app with no runtime in it
        run: |
          test -s android/app/libs/libXray.aar || {
            echo "libXray.aar is missing — the APK would build without a tunnel" >&2
            exit 1
          }
          ls -l android/app/libs/

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the platform this app compiles against
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      # A debug key is generated on the runner, and the runner is new every run.
      # A new key means a new signature, and Android refuses to install an update
      # signed by a different key: every build would demand that the previous one
      # be uninstalled first, taking its settings with it. So the key is kept in
      # a directory of this workflow's own, cached under a fixed name, and the
      # build is pointed at it through JORDAN_DEBUG_KEYSTORE.
      #
      # The toolchain's own default location is not used, because it is not one
      # location: it moves with the platform and the SDK's preference directory,
      # and a cache of a path that turns out to be empty saves nothing at all
      # while looking like it worked.
      #
      # This is the ordinary Android debug key — the published password, never
      # used for a release. Release signing is separate and comes from
      # keystore.properties or the JORDAN_KEYSTORE* variables, and nothing about
      # it is in this repository.
      - name: Restore the debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.jordan-debug-key
          key: android-debug-keystore-v2

      - name: Create the debug key if there was none to restore
        run: |
          mkdir -p ~/.jordan-debug-key
          store=~/.jordan-debug-key/debug.keystore
          if [ ! -f "$store" ]; then
            keytool -genkeypair -v -keystore "$store" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
          echo "JORDAN_DEBUG_KEYSTORE=$store" >> "$GITHUB_ENV"

      # Unit tests first: they are the only thing in this pipeline that can fail
      # on a mistake the compiler is happy with — an icon path the renderer
      # cannot read whole, say.
      - name: Run the unit tests
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      # Printed so the key can be checked rather than assumed: two builds that
      # show the same certificate digest will install over each other, and two
      # that do not will not.
      - name: Say which key signed it
        working-directory: android
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk | grep -i 'SHA-256 digest'

      - name: Attach the APK to this run
        uses: actions/upload-artifact@v4
        with:
          name: jordan-vpn-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A failed build is the useful output too: the compiler's own words,
      # kept where they can be read without opening a laptop.
      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore
